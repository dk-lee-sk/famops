    trigger: Event
    frequency: One-off
    cognitive_phase: Monitor
    coordination: Medium
    time_sensitivity: High
    failure: Treatable condition missed
    ai_fit: High
    bench_category: Health admin
    evidence: Screening due 24–48h after birth
    source:
    - S5
    priority: false
  - id: N02
    scenario: Hospital discharge & first 72h
